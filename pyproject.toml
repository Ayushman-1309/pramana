[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pramana"
version = "2.0.0"
description = "Unified Cosmological Inference Suite — SN Ia, BAO, CMB, JWST probes with MCMC, Nested Sampling, HMC/NUTS, Fisher, SBI, GP Emulation, MOPED"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Ayushman", email = "ayushman@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "emcee>=3.1",
    "dynesty>=2.1",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpyro>=0.13",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "sbi>=0.23",
    "corner>=2.2",
    "getdist>=1.3",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "streamlit>=1.37",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "openpyxl>=3.1",
    "kaleido>=0.2.1",
]

[project.optional-dependencies]
camb = ["camb>=1.5"]
act = ["cobaya>=3.3"]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]
web = ["streamlit>=1.37", "plotly>=5.22"]
all = ["camb>=1.5", "cobaya>=3.3", "streamlit>=1.37", "plotly>=5.22"]

[project.scripts]
pramana = "pramana.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pramana*"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "UP", "W", "C4", "C9", "D", "DT", "T20", "SIM", "RET", "PTH", "ERA", "PL", "TRY", "ARG", "LOG", "ASYNC"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "S101", "N806", "PTH118", "PTH123"]
fixable = ["ALL"]
unfixable = ["T20", "D"]
exclude = [".git", ".venv", "dist", "build", "__pycache__", "*.pyc"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
indent-width = 4
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/pramana"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError"]
precision = 2

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
